name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Test
        run: PYTHONPATH=src pytest -q
      - name: Demo holds its invariant
        run: PYTHONPATH=src python -m durable_agent.demo
      - name: Demo holds under provider failure
        run: PYTHONPATH=src python -m durable_agent.demo --chaos
      - name: Benchmark runs
        run: PYTHONPATH=src python scripts/benchmark.py
