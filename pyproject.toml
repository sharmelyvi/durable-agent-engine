[project]
name = "durable-agent-engine"
version = "0.1.0"
description = "Crash-resilient, at-most-once agent execution on PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# The core has one dependency. SQLite ships with Python, so `pip install
# durable-agent-engine` gives you a working engine and the demo with nothing
# else to set up. Postgres is opt-in.
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5", "psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
