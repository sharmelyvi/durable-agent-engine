# Postgres for the PostgresStore tests.
#
# Deliberately on port 55433, not 5432: a developer running this repo almost
# certainly has their own Postgres already, and a compose file that squats on
# the default port is a good way to confuse someone else's database with this
# one's fixtures.
services:
  postgres:
    image: postgres:16-alpine
    container_name: durable-agent-postgres
    environment:
      POSTGRES_USER: durable
      POSTGRES_DB: durable_test
      # No password. The container is bound to 127.0.0.1 and its data lives in
      # tmpfs, so there is nothing to protect — and a repository with no
      # credential-shaped string in it cannot leak one by copy-paste.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      # Test data has no reason to outlive the container.
      - /var/lib/postgresql/data
